# console.akingpeace.asia —— Cloudflare 橙云回源到本机 OpenResty(80/443)，再反代到本地 8089
# 既承载 TMDB 控制台(/dashboard、/api/stats)，也兼做 TMDB 缓存代理(其余路径)
# 证书为自签(匹配 zone SSL 模式=full，Cloudflare 接受任意证书)
server {
    listen 80;
    listen 443 ssl;
    server_name console.akingpeace.asia;
    access_log /www/sites/console.akingpeace.asia/log/access.log main;
    error_log  /www/sites/console.akingpeace.asia/log/error.log;

    location / {
        proxy_pass http://127.0.0.1:8089;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        # 透传 Cloudflare 的 X-Forwarded-Proto(橙云回源为 https)，让图片改写用 https
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    http2 on;
    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }
    ssl_certificate     /www/sites/console.akingpeace.asia/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/console.akingpeace.asia/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    error_page 497 https://$host$request_uri;
    add_header Strict-Transport-Security "max-age=31536000";
}
